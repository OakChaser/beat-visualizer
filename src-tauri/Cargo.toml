[package]
name = "beat-visualizer"
version = "0.1.0"
description = "Desktop beat and downbeat visualizer built on the Beat This! model"
edition = "2021"
license = "MIT"
repository = "https://github.com/OakChaser/beat-visualizer"

[lib]
name = "beat_visualizer_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
beat-this = { version = "1.1", default-features = false, features = ["decode"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
